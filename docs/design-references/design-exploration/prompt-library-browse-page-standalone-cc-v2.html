  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"dcdf7369-f0de-49e7-8f1a-e10c5bec78f7\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n\n\n<helmet>\n  <style>\n    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }\n    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }\n    @keyframes traceBorder { to { stroke-dashoffset: 0; } }\n    @keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }\n    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }\n    body { margin: 0; background: #000; }\n    /* Personalise trace animation */\n    .trace-btn:hover .trace-rect, .trace-btn:active .trace-rect { opacity: 1 !important; animation-play-state: running !important; }\n    /* Nav underline on hover */\n    a:hover .nav-underline { opacity: 1 !important; transform: scaleX(1) !important; }\n\n    /* Library Surprise Me button */\n    .lib-surprise-btn {\n      min-width: 154px; min-height: 50px;\n      position: relative; isolation: isolate; overflow: hidden;\n      appearance: none; border: 1px solid rgba(255,255,255,0.12);\n      padding: 13px 20px; border-radius: 999px;\n      font-family: 'Segoe UI', system-ui, sans-serif;\n      font-size: 15px; font-weight: 700;\n      cursor: pointer; display: inline-flex; align-items: center;\n      justify-content: center; gap: 9px;\n      background: rgba(8,10,12,0.78); color: #fff;\n      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n      white-space: nowrap; flex-shrink: 0;\n      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;\n    }\n    .lib-surprise-btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.055); }\n    .lib-surprise-btn:focus-visible { outline: 2px solid #00D639; outline-offset: 4px; }\n    .lib-surprise-shimmer {\n      position: absolute; inset: -45%; z-index: 1; pointer-events: none;\n      opacity: 0; transform: translateX(-95%);\n      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.55) 48%, transparent 60%);\n    }\n    .lib-surprise-label { position: relative; z-index: 2; }\n    .lib-surprise-btn.is-shimmering .lib-surprise-shimmer { animation: libShimmerSweep 1100ms ease-in-out both; }\n    .lib-surprise-btn.is-bouncing { animation: libGentleBounce 900ms ease-in-out both; }\n    .lib-surprise-btn.is-pulsing { animation: libSoftPulse 950ms ease-in-out both; }\n    .lib-surprise-btn.is-wiggling { animation: libTinyWiggle 900ms ease-in-out both; transform-origin: 50% 80%; }\n    @keyframes libShimmerSweep {\n      0% { opacity:0; transform:translateX(-95%); }\n      15% { opacity:1; }\n      85% { opacity:0.8; }\n      100% { opacity:0; transform:translateX(95%); }\n    }\n    @keyframes libGentleBounce {\n      0%,100% { transform:translateY(0); }\n      35% { transform:translateY(-7px); }\n      62% { transform:translateY(0); }\n      82% { transform:translateY(-3px); }\n    }\n    @keyframes libSoftPulse {\n      0%,100% { transform:scale(1); }\n      50% { transform:scale(1.045); }\n    }\n    @keyframes libTinyWiggle {\n      0%,100% { transform:rotate(0deg); }\n      28% { transform:rotate(-2.5deg); }\n      54% { transform:rotate(2.5deg); }\n      78% { transform:rotate(-1deg); }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      .lib-surprise-btn, .lib-surprise-btn.is-shimmering .lib-surprise-shimmer,\n      .lib-surprise-btn.is-bouncing, .lib-surprise-btn.is-pulsing, .lib-surprise-btn.is-wiggling { animation: none; transition: none; }\n    }\n    /* Card hover expand icon */\n    .lib-card:hover .expand-ico { opacity: 1 !important; transform: scale(1) translateY(0) !important; }\n    /* Responsive grid */\n    @media (max-width: 780px) { .lib-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }\n    @media (max-width: 500px) { .lib-grid-3 { grid-template-columns: 1fr !important; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<template id=\"__bundler_thumbnail\" data-bg-color=\"#000000\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#000\"><\u002Frect>\n    <text x=\"600\" y=\"120\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"rgba(255,255,255,0.4)\" letter-spacing=\"4\">FROM THE MA&amp;A TEAM<\u002Ftext>\n    <text x=\"600\" y=\"190\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"52\" font-weight=\"900\" fill=\"#ffffff\">Copy. Paste. Go.<\u002Ftext>\n    <rect x=\"200\" y=\"260\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"480\" y=\"260\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"760\" y=\"260\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"200\" y=\"420\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"480\" y=\"420\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"760\" y=\"420\" width=\"240\" height=\"140\" rx=\"14\" fill=\"#0B0B0B\" stroke=\"rgba(255,255,255,0.46)\" stroke-width=\"1\"><\u002Frect>\n    <rect x=\"460\" y=\"590\" width=\"120\" height=\"36\" rx=\"18\" fill=\"#00D639\"><\u002Frect>\n    <text x=\"520\" y=\"614\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#000\">Personalise<\u002Ftext>\n  <\u002Fsvg>\n<\u002Ftemplate>\n\n<div style=\"min-height: 100vh; background: #000; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden\">\n\n  <!-- Top Navigation -->\n  <div style=\"border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 32px\">\n    <div style=\"max-width: {{ containerMaxWidth }}px; margin: 0 auto; display: flex; gap: 40px; height: 56px; align-items: center\">\n      <a href=\"#\" style=\"font-size: 14px; font-weight: 600; color: #fff; text-decoration: none; position: relative; padding-bottom: 2px; transition: color 0.2s\" style-hover=\"color: #00D639\">\n        <span>Home<\u002Fspan>\n        <div style=\"position: absolute; bottom: -8px; left: 18%; right: 18%; height: 2px; background: #00D639; border-radius: 999px; opacity: 0; transform: scaleX(0); transform-origin: center; transition: transform 220ms ease, opacity 180ms ease; pointer-events: none\" class=\"nav-underline\"><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"font-size: 14px; font-weight: 700; color: #00D639; text-decoration: none; position: relative; padding-bottom: 2px; transition: all 0.2s\" style-hover=\"color: #00D639\">\n        <span>Library<\u002Fspan>\n        <div style=\"position: absolute; bottom: -8px; left: 18%; right: 18%; height: 2px; background: #00D639; border-radius: 999px; opacity: 1; transform: scaleX(1); transform-origin: center; transition: transform 220ms ease, opacity 180ms ease; pointer-events: none\" class=\"nav-underline\"><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7); text-decoration: none; position: relative; padding-bottom: 2px; transition: color 0.2s\" style-hover=\"color: #fff\">\n        <span>Personalise<\u002Fspan>\n        <div style=\"position: absolute; bottom: -8px; left: 18%; right: 18%; height: 2px; background: #00D639; border-radius: 999px; opacity: 0; transform: scaleX(0); transform-origin: center; transition: transform 220ms ease, opacity 180ms ease; pointer-events: none\" class=\"nav-underline\"><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7); text-decoration: none; position: relative; padding-bottom: 2px; transition: color 0.2s\" style-hover=\"color: #fff\">\n        <span>Feedback<\u002Fspan>\n        <div style=\"position: absolute; bottom: -8px; left: 18%; right: 18%; height: 2px; background: #00D639; border-radius: 999px; opacity: 0; transform: scaleX(0); transform-origin: center; transition: transform 220ms ease, opacity 180ms ease; pointer-events: none\" class=\"nav-underline\"><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Header -->\n  <div style=\"max-width: {{ containerMaxWidth }}px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 40px; margin-bottom: 40px\">\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 18px\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #00D639; display: inline-block; animation: pulse 2s ease-in-out infinite; font-size: 18px\"><\u002Fspan>\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.7); text-decoration-line: none\">From the MA&amp;A Team<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-size: 52px; font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 14px\">Copy.<br><span style=\"color: #00D639\">Paste.<\u002Fspan> Go.<\u002Fh1>\n      <p style=\"color: rgba(255,255,255,0.78); font-size: 16px; line-height: 1.6; max-width: 480px; margin: 0\">Prompts tried, tested and shared by the MA&amp;A team. Find what you need, copy it, and make it yours.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Search + Filters -->\n  <div style=\"max-width: {{ containerMaxWidth }}px; margin: 0 auto; padding: 0 32px\">\n    <div style=\"max-width: {{ pillsContainerWidth }}px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; justify-content: center\">\n      <sc-for list=\"{{ categoryPills }}\" as=\"pill\">\n        <button onclick=\"{{ pill.onClick }}\" style=\"display: inline-flex; align-items: center; gap: 6px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: all 0.18s; white-space: nowrap; border: 1px solid {{ pill.borderColor }}; background: {{ pill.bg }}; color: {{ pill.color }}\" style-hover=\"border-color: #fff\">{{ pill.iconHtml }}{{ pill.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; margin-bottom: 24px\">\n      <div style=\"position: relative; flex: 1\">\n        <svg style=\"position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: rgba(255,255,255,0.3); pointer-events: none\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7.5\"><\u002Fcircle><path d=\"M21 21l-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n        <input id=\"lib-search\" type=\"text\" placeholder=\"Search prompts...\" autocomplete=\"off\" style=\"width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.35); border-radius: 14px; padding: 14px 18px 14px 46px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s;\" onfocus=\"this.style.borderColor='#00D639'; this.style.boxShadow='0 0 0 3px rgba(0,214,57,0.1)'\" onblur=\"this.style.borderColor='rgba(255,255,255,0.35)'; this.style.boxShadow='none'\" oninput=\"{{ onSearch }}\">\n      <\u002Fdiv>\n      <button id=\"libSurpriseBtn\" class=\"lib-surprise-btn\" onclick=\"{{ onSurpriseMe }}\" type=\"button\" aria-label=\"Surprise me — library\">\n        <span class=\"lib-surprise-shimmer\" aria-hidden=\"true\"><\u002Fspan>\n        <span class=\"lib-surprise-label\">Surprise me ✦<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Cards Grid -->\n  <div style=\"max-width: {{ containerMaxWidth }}px; margin: 0 auto; padding: 0 32px 80px\">\n    <div class=\"lib-grid-3\" style=\"display: grid; grid-template-columns: {{ gridCols }}; gap: 18px\">\n      <sc-for list=\"{{ cards }}\" as=\"card\" hint-placeholder-count=\"6\">\n        <div class=\"lib-card\" onclick=\"{{ card.onExpand }}\" style=\"position: relative; background: {{ card.cardBg }}; border: 1px solid {{ card.cardBorder }}; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; cursor: pointer; transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s, background 0.18s; box-shadow: {{ card.cardShadow }}\" style-hover=\"border-color: {{ card.cardHoverBorder }}; transform: translateY(-2px); box-shadow: {{ card.cardHoverShadow }}; background: {{ card.cardHoverBg }}\">\n\n          <div>\n            <!-- Category label -->\n            <sc-if value=\"{{ card.showCategory }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.36); margin-bottom: 12px; padding-right: 30px\">{{ card.category }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Title -->\n            <div style=\"font-size: 17px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 10px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-right: 22px\">{{ card.title }}<\u002Fdiv>\n\n            <!-- Truncated prompt -->\n            <div style=\"font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.85); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden\">{{ card.promptHtml }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Buttons -->\n          <div style=\"display: grid; grid-template-columns: 1fr 0.82fr; gap: 10px; margin-top: auto; padding-top: 18px\">\n            <!-- Personalise button with trace -->\n            <button class=\"trace-btn\" onclick=\"{{ card.onPersonalise }}\" style=\"position: relative; overflow: hidden; isolation: isolate; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; padding: 0 14px; height: 38px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.12); color: #00D639; transition: border-color 0.16s, background 0.16s, transform 0.16s\" style-hover=\"border-color: transparent; background: rgba(255,255,255,0.06); transform: translateY(-1px)\">\n              <svg style=\"position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible\" viewBox=\"0 0 260 38\" preserveAspectRatio=\"none\"><rect class=\"trace-rect\" x=\"1.5\" y=\"1.5\" width=\"257\" height=\"35\" rx=\"18\" pathLength=\"1\" fill=\"none\" stroke=\"#00D639\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\" opacity=\"0\" stroke-linecap=\"round\" stroke-dasharray=\"0.22 0.78\" stroke-dashoffset=\"1\" style=\"filter: drop-shadow(0 0 7px rgba(0,214,57,0.45)); transition: opacity 0.16s; animation: traceBorder 1.45s linear infinite; animation-play-state: paused\"><\u002Frect><\u002Fsvg>\n              <span style=\"position: relative; z-index: 2\">Personalise<\u002Fspan>\n            <\u002Fbutton>\n            <!-- Copy button -->\n            <button onclick=\"{{ card.onCopy }}\" style=\"font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; padding: 0 14px; height: 38px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.12); color: #fff; transition: border-color 0.16s, background 0.16s, transform 0.16s, color 0.16s\" style-hover=\"border-color: rgba(255,255,255,0.26); background: rgba(255,255,255,0.075); transform: translateY(-1px)\">{{ card.copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- Expand icon on hover -->\n          <svg class=\"expand-ico\" style=\"position: absolute; top: 18px; right: 18px; width: 18px; height: 18px; color: #00D639; opacity: 0; transform: scale(0.92) translateY(4px); transition: opacity 0.16s, transform 0.16s; pointer-events: none\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3h5v5\"><\u002Fpath><path d=\"M21 3l-7 7\"><\u002Fpath><path d=\"M8 21H3v-5\"><\u002Fpath><path d=\"M3 21l7-7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- No results -->\n    <sc-if value=\"{{ showNoResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align: center; padding: 64px 20px; color: rgba(255,255,255,0.4); font-size: 15px\">No prompts match your search.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Footer -->\n  <\u002Fdiv>\n\n  <div style=\"max-width: {{ containerMaxWidth }}px; margin: 0 auto; padding: 0 32px; text-align: center; padding-top: 48px; margin-top: 48px; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 0.04em\">From the MA&amp;A Team — Sage<\u002Fdiv>\n\n  <!-- Modal Overlay -->\n  <sc-if value=\"{{ showModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.86); backdrop-filter: blur(24px) saturate(0.5); display: flex; align-items: center; justify-content: center; padding: 24px; animation: overlayIn 0.2s ease\">\n      <div onclick=\"{{ stopProp }}\" style=\"width: min(680px, calc(100% - 48px)); max-height: 82vh; overflow-y: auto; overflow-x: hidden; border: 1px solid rgba(255,255,255,0.22); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)), #050505; box-shadow: 0 30px 110px rgba(0,0,0,0.72); padding: 28px; animation: modalIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)\">\n        <!-- Close button -->\n        <div style=\"display: flex; justify-content: flex-end; margin-bottom: 4px\">\n          <button onclick=\"{{ closeModal }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; width: 32px; height: 32px; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: border-color 0.2s, color 0.2s\" style-hover=\"border-color: rgba(255,255,255,0.3); color: #fff\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <!-- Category -->\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #00D639; margin-bottom: 8px\">{{ modalData.category }}<\u002Fdiv>\n        <!-- Tools -->\n        <div style=\"font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 20px; letter-spacing: 0.03em\">{{ modalData.tool }}<\u002Fdiv>\n        <!-- Title -->\n        <div style=\"font-size: 36px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 24px\">{{ modalData.title }}<\u002Fdiv>\n        <!-- Full prompt -->\n        <div style=\"font-size: 16px; line-height: 1.65; color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px; white-space: pre-wrap; word-break: break-word\">{{ modalData.promptHtml }}<\u002Fdiv>\n        <!-- Source badge -->\n        <div style=\"margin-top: 20px; display: flex; align-items: center; gap: 10px\">\n          <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; background: rgba(0,214,57,0.1); color: #00D639; border: 1px solid rgba(0,214,57,0.2)\">{{ modalData.source }}<\u002Fspan>\n        <\u002Fdiv>\n        <!-- Actions -->\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px\">\n          <button onclick=\"{{ modalData.onPersonalise }}\" style=\"position: relative; overflow: hidden; isolation: isolate; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; padding: 14px 20px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #00D639; transition: all 0.16s\" style-hover=\"border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06)\">\n            <svg style=\"position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible\" viewBox=\"0 0 260 44\" preserveAspectRatio=\"none\"><rect x=\"1.5\" y=\"1.5\" width=\"257\" height=\"41\" rx=\"21\" pathLength=\"1\" fill=\"none\" stroke=\"#00D639\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\" opacity=\"0\" stroke-linecap=\"round\" stroke-dasharray=\"0.22 0.78\" stroke-dashoffset=\"1\" style=\"filter: drop-shadow(0 0 7px rgba(0,214,57,0.45)); transition: opacity 0.16s; animation: traceBorder 1.45s linear infinite; animation-play-state: paused\"><\u002Frect><\u002Fsvg>\n            <span style=\"position: relative; z-index: 2\">Personalise<\u002Fspan>\n          <\u002Fbutton>\n          <button onclick=\"{{ modalData.onCopy }}\" style=\"font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; padding: 14px 20px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #fff; transition: all 0.16s\" style-hover=\"border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.07)\">{{ modalData.copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Personaliser Overlay -->\n  <sc-if value=\"{{ showPersonaliser }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closePersonaliser }}\" style=\"position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.86); backdrop-filter: blur(24px) saturate(0.5); display: flex; align-items: center; justify-content: center; padding: 24px; animation: overlayIn 0.2s ease\">\n      <div onclick=\"{{ stopProp }}\" style=\"width: min(680px, 100%); max-height: 85vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.18); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)), #0a0a0a; box-shadow: 0 32px 100px rgba(0,0,0,0.7); padding: 32px; animation: modalIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)\">\n        <!-- Close -->\n        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #00D639\">Personalise prompt<\u002Fdiv>\n          <button onclick=\"{{ closePersonaliser }}\" style=\"background: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; width: 32px; height: 32px; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: border-color 0.2s, color 0.2s\" style-hover=\"border-color: rgba(255,255,255,0.3); color: #fff\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <!-- Title -->\n        <div style=\"font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 24px\">{{ persData.title }}<\u002Fdiv>\n        <!-- Variable inputs -->\n        <sc-for list=\"{{ persData.vars }}\" as=\"v\">\n          <div style=\"margin-bottom: 16px\">\n            <label style=\"display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 6px\">Fill in: <span style=\"color: #00D639; font-weight: 700\">{{ v.label }}<\u002Fspan><\u002Flabel>\n            <input type=\"text\" placeholder=\"{{ v.placeholder }}\" oninput=\"{{ v.onInput }}\" style=\"width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 14px; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s\" onfocus=\"this.style.borderColor='#00D639'; this.style.boxShadow='0 0 0 3px rgba(0,214,57,0.1)'\" onblur=\"this.style.borderColor='rgba(255,255,255,0.1)'; this.style.boxShadow='none'\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <!-- Live preview -->\n        <div style=\"margin-top: 8px; margin-bottom: 20px\">\n          <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 12px\">Live preview<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; white-space: pre-wrap; word-break: break-word\">{{ persData.previewHtml }}<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- Copy -->\n        <button onclick=\"{{ persData.onCopy }}\" style=\"width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; padding: 14px; border-radius: 12px; cursor: pointer; border: none; background: #00D639; color: #000; transition: opacity 0.2s, transform 0.15s\" style-hover=\"opacity: 0.88; transform: translateY(-1px)\">{{ persData.copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;showCategories&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;columns&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;2&quot;,&quot;3&quot;,&quot;4&quot;],&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;containerWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:980,&quot;min&quot;:800,&quot;max&quot;:1400,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;},&quot;pillsContainerWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:850,&quot;min&quot;:600,&quot;max&quot;:1400,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;}}\">\n\nclass Component extends DCLogic {\n  state = {\n    search: '',\n    activeCategory: -1,\n    modalPrompt: null,\n    persPrompt: null,\n    varValues: {},\n    copyStates: {},\n    modalCopyState: '',\n    persCopyState: ''\n  };\n\n  data = [\n    {\n      category: \"Getting Started\",\n      prompts: [\n        { title: \"What can you do?\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"What can you do? Give me practical examples relevant to someone working in [your role].\" },\n        { title: \"Smallest step today\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"What's the smallest thing I can do today to get started with [topic] using AI?\" },\n        { title: \"Break down a task into steps\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"How can I break this down into smaller steps? [paste your task here]\" },\n        { title: \"Help me prioritise tasks\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"I have a list of tasks. Help me prioritise them by effort vs impact. [paste your list]\" },\n      ]\n    },\n    {\n      category: \"Data & Analysis\",\n      prompts: [\n        { title: \"Analyse data and surface key insights\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"I'm analysing this dataset for [context or goal]. Identify 3–5 key insights I should present. Focus on meaningful trends, patterns, or anomalies. For each insight, explain what's happening, why it matters, and what action it suggests. Present the insights in a clear, clean table. Then suggest a few follow-up questions or areas to explore next. [upload data]\" },\n        { title: \"Spot the story in data\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Here's some [campaign or report] data. What's the main story I should be telling from this? [paste data or description]\" },\n        { title: \"Get to the \\\"so what\\\"\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Here are my results: [paste results]. Help me get to the \\\"so what\\\" — what does this mean and what should we do next?\" },\n        { title: \"Build hypotheses from data\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"I'm seeing [observation] in my data. Help me build 3 hypotheses for why this might be happening.\" },\n        { title: \"Sense check analysis\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Here's my analysis and conclusion: [paste]. Can you sense check my logic and flag anything I might have missed?\" },\n        { title: \"Analyse churn drivers\", tool: \"Copilot\", source: \"Team submission\", prompt: \"You are a data analyst. Analyse the following customer data and identify the top drivers of churn. Focus on patterns related to complexity score, engagement metrics, and support interactions. Provide a summary of findings and recommend actions to reduce churn. [paste data]\" },\n        { title: \"Analyse A/B test results\", tool: \"Claude\", source: \"Team submission\", prompt: \"Analyse the results of an A/B test in Power BI using DAX. The test compares two versions of [describe test]. Calculate statistical significance, identify the winning variant, and summarise the key takeaways. [paste data or DAX code]\" },\n        { title: \"Build a data dashboard\", tool: \"ChatGPT\", source: \"Team submission\", prompt: \"Help me design a Power BI dashboard for [business area or team]. Suggest key metrics to include, how to structure the layout, and which visualisations would work best for the audience. The goal is to make it easy to spot trends and take action.\" },\n        { title: \"Compare organic vs brand search\", tool: \"Claude\", source: \"Team submission\", prompt: \"Analyse the following search data and compare organic vs brand search performance. Identify trends, highlight areas of concern, and suggest actions to improve organic visibility. [paste data]\" },\n        { title: \"Reconcile email performance data\", tool: \"Snowflake Cortex\", source: \"Team submission\", prompt: \"I have email performance data from two sources that don't match. Help me identify discrepancies between [source A] and [source B]. Highlight rows where metrics differ significantly and suggest reasons for the gaps. [paste data]\" },\n        { title: \"Analyse email fatigue\", tool: \"Snowflake Cortex\", source: \"Team submission\", prompt: \"Using the following email engagement data, identify signs of audience fatigue. Look for declining open rates, increasing unsubscribes, and drop-off patterns over time. Recommend actions to re-engage the audience. [paste data]\" },\n      ]\n    },\n    {\n      category: \"Writing & Comms\",\n      prompts: [\n        { title: \"Improve written content\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"Here's a draft I've written. Improve the clarity and cut anything unnecessary while keeping the meaning. [paste draft]\" },\n        { title: \"Summarise for leadership\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Summarise the following for a senior leadership audience. Start with a single sentence that clearly states the key insight or takeaway (\\\"the so what\\\"). Then provide 2–3 short bullet points covering the key impacts or recommended actions. Use clear, direct language and avoid unnecessary detail. [paste content]\" },\n        { title: \"Write a team update\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"Write a short team update about [topic]. Use 3–5 bullet points, clear and direct language, and focus on key updates and actions.\" },\n        { title: \"Translate into plain English\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"Rewrite this in plain English for a non-technical stakeholder. [paste text]\" },\n        { title: \"Generate content angles\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"I'm creating content about [topic] for [audience]. Give me 5 different angles or hooks.\" },\n        { title: \"Improve marketing copy\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"Rewrite this copy to be more compelling and specific. Remove generic phrases. [paste copy]\" },\n        { title: \"Generate subject line options\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"Write 5 subject line variants for a campaign about [topic]. Audience: [audience]. Goal: [goal].\" },\n        { title: \"Tailor message to audience\", tool: \"ChatGPT · Copilot · Claude\", source: \"Starter prompt\", prompt: \"How would you position [message] for [specific audience]? What language would resonate?\" },\n        { title: \"Review and improve content\", tool: \"Copilot\", source: \"Team submission\", prompt: \"Review and improve the following written content. Make it clearer, more concise, and more engaging while keeping the original meaning. Highlight any changes you make and explain why. [paste content]\" },\n        { title: \"Generate internal social posts\", tool: \"Copilot\", source: \"Team submission\", prompt: \"Write 3 Viva Engage posts about [topic] for an internal audience. Keep each post under 150 words. The tone should be [professional/conversational/inspiring]. Include a call to action in each post.\" },\n        { title: \"Rewrite email from notes\", tool: \"Copilot\", source: \"Team submission\", prompt: \"I have rough notes from a meeting or conversation. Turn them into a clear, professional email. Keep it concise, lead with the key message, and include a clear next step. [paste notes]\" },\n      ]\n    },\n    {\n      category: \"Strategy & Planning\",\n      prompts: [\n        { title: \"Challenge ideas with devil's advocate\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Team submission\", prompt: \"Play devil's advocate on the following idea or plan. Identify the biggest risks, weaknesses, and assumptions. Be specific and constructive — the goal is to stress-test the thinking, not just criticise. [describe idea or paste plan]\" },\n        { title: \"Research customer journey stages\", tool: \"ChatGPT\", source: \"Team submission\", prompt: \"Research and summarise the typical journey a [type of customer] goes through when [describe decision or process]. Identify the key stages, what they're thinking and feeling at each stage, and what information or support they need. Format this as a clear journey map.\" },\n      ]\n    },\n    {\n      category: \"Learning & Exploration\",\n      prompts: [\n        { title: \"Learn a topic quickly\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Give me a clear, structured overview of [topic]. Include key concepts, a simple example, and when it's used in practice. Keep it concise.\" },\n        { title: \"Compare two concepts\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"What's the difference between [concept A] and [concept B]? Use a real-world example.\" },\n        { title: \"Quiz me on a topic\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Quiz me on [topic] with 5 questions, starting easy and getting harder. After each answer, tell me if I'm right and explain why.\" },\n        { title: \"Recommend next learning step\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"I've just learned about [topic]. What should I explore next to go deeper?\" },\n        { title: \"Explain using a simple diagram\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Explain how [concept] works using a simple text-based (ASCII) diagram and include a short explanation alongside it. Make it easy to follow and clearly show the structure or flow.\" },\n        { title: \"Learn a topic quickly (80/20)\", tool: \"ChatGPT\", source: \"Team submission\", prompt: \"I want to learn about [topic]. Use the 80/20 rule to focus on the 20% of concepts that will give me 80% of the understanding. Give me a structured overview with the most important ideas first, practical examples, and what to focus on to get up to speed quickly.\" },\n        { title: \"Break down complex ideas\", tool: \"Claude\", source: \"Team submission\", prompt: \"Take the following complex concept and break it down so that someone new to the topic can understand it. Use simple language, avoid jargon, and include a real-world analogy to make it stick. [paste concept or topic]\" },\n      ]\n    },\n    {\n      category: \"Go Deeper\",\n      prompts: [\n        { title: \"Break down a topic from first principles\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Break [topic] down using first principles thinking. Start by identifying the common assumptions people make about this topic. Then strip those assumptions away and focus only on what is fundamentally true. Rebuild the concept step by step from these core truths. Show what changes when you remove inherited thinking.\" },\n        { title: \"Explain a topic simply (no jargon)\", tool: \"ChatGPT · Copilot · Claude · Cortex\", source: \"Starter prompt\", prompt: \"Now explain [topic] as if I'm new to it. Use no jargon, no assumed knowledge, and include two different examples to make it clear. If anything is still unclear, simplify it further until it's genuinely easy to understand.\" },\n      ]\n    },\n    {\n      category: \"Coding\",\n      prompts: [\n        { title: \"Fix a DAX formula\", tool: \"Claude\", source: \"Team submission\", prompt: \"I have a DAX formula that isn't working as expected. Review the code, identify the issue, and provide a corrected version with an explanation of what was wrong and why the fix works. [paste DAX code]\" },\n        { title: \"Generate UI code\", tool: \"Copilot\", source: \"Team submission\", prompt: \"Generate an Adaptive Card JSON for [describe the card's purpose and content]. It should include [list key elements e.g. title, body text, action buttons]. Make it clean and functional for use in [Teams / Outlook / Power Automate].\" },\n        { title: \"Fix bugs step by step\", tool: \"Claude\", source: \"Team submission\", prompt: \"I have a bug in my code that I can't resolve. Walk me through debugging it step by step. Ask me clarifying questions if needed, suggest what to check first, and help me identify the root cause before suggesting a fix. [paste code and describe the issue]\" },\n        { title: \"Improve application code\", tool: \"Claude\", source: \"Team submission\", prompt: \"Review the following code and suggest improvements. Focus on readability, performance, and best practices. Explain each change you recommend and why it makes the code better. [paste code]\" },\n        { title: \"Check SQL query\", tool: \"Snowflake Cortex\", source: \"Team submission\", prompt: \"Review the following SQL query and check it for errors, inefficiencies, or logic issues. Suggest improvements and explain your reasoning. If the query can be simplified or optimised, show me how. [paste SQL]\" },\n        { title: \"Aggregate data using code\", tool: \"Claude\", source: \"Team submission\", prompt: \"Write a script to aggregate data from [describe data source or structure]. The goal is to [describe output e.g. summarise by region, calculate totals by month]. Use [R / Python / SQL] and include comments explaining each step. [paste data sample if available]\" },\n        { title: \"Aggregate CSV data\", tool: \"Claude\", source: \"Team submission\", prompt: \"I have a CSV file with the following structure: [describe columns and data]. Write an R script to load the file, aggregate the data by [field], and output a summary table showing [desired metrics]. Include error handling and comments.\" },\n        { title: \"Convert date format\", tool: \"Copilot\", source: \"Team submission\", prompt: \"I have a column in Excel with dates in [current format e.g. DD/MM/YYYY]. Write a formula to convert them to [target format e.g. YYYY-MM-DD]. Explain how the formula works and how to apply it to the full column.\" },\n        { title: \"Improve data model\", tool: \"Claude\", source: \"Team submission\", prompt: \"Review the following data model or notebook and suggest improvements. Focus on structure, clarity, and performance. Highlight any issues with the current approach and recommend a better way to organise or write the code. [paste code or describe model]\" },\n        { title: \"Build a Workfront calculated field\", tool: \"Copilot\", source: \"Team submission\", prompt: \"Help me build a calculated field in Workfront for [describe the purpose]. The field should [describe logic or output]. Walk me through the formula syntax and how to set it up correctly in Workfront.\" },\n      ]\n    },\n    {\n      category: \"Tools & Workflows\",\n      prompts: [\n        { title: \"Automate QA tasks\", tool: \"Copilot\", source: \"Team submission\", prompt: \"Help me automate the following quality assurance task in [tool or system]: [describe task]. Suggest a workflow or process that reduces manual effort, catches errors early, and can be repeated consistently. Include any formulas, scripts, or steps needed.\" },\n        { title: \"Apply brand styling to app\", tool: \"Claude\", source: \"Team submission\", prompt: \"I have a Streamlit app and want to apply our brand colours and styling. Our primary colour is [hex code], secondary is [hex code], and font is [font name]. Update the app's CSS and layout to match these brand guidelines while keeping the functionality intact. [paste current code]\" },\n      ]\n    },\n    {\n      category: \"Design & Imagery\",\n      prompts: [\n        { title: \"Localise image for market\", tool: \"Adobe\", source: \"Team submission\", prompt: \"I need to localise the following image for the [market/region] market. Adapt any text, imagery, or cultural references to be appropriate and relevant for that audience. Highlight what changes you would make and why. [describe or attach image]\" },\n        { title: \"Localise video for market\", tool: \"Adobe\", source: \"Team submission\", prompt: \"I need to localise this video for the [market/region] market. Suggest changes to voiceover, on-screen text, visuals, and cultural references to make it suitable for the local audience. Provide a list of recommended adaptations. [describe video content]\" },\n      ]\n    },\n  ];\n\n  escHtml(s) {\n    return s.replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n  }\n\n  highlightVars(text) {\n    return this.escHtml(text).replace(/\\[([^\\]]*)\\]/g, (m, k) => {\n      return '<span style=\"color:#00D639;font-weight:700\">[' + k + ']<\u002Fspan>';\n    });\n  }\n\n  extractVars(prompt) {\n    const matches = [...prompt.matchAll(/\\[([^\\]]*)\\]/g)];\n    const seen = new Set();\n    return matches.filter(m => { if (seen.has(m[1])) return false; seen.add(m[1]); return true; }).map(m => m[1]);\n  }\n\n  getAllPrompts() {\n    const search = this.state.search.toLowerCase().trim();\n    const catIdx = this.state.activeCategory;\n    let all = [];\n    this.data.forEach((section, si) => {\n      if (catIdx !== -1 && si !== catIdx) return;\n      section.prompts.forEach(p => {\n        all.push({ ...p, category: section.category });\n      });\n    });\n    if (search) {\n      all = all.filter(p =>\n        p.title.toLowerCase().includes(search) ||\n        p.prompt.toLowerCase().includes(search) ||\n        p.category.toLowerCase().includes(search) ||\n        (p.tool && p.tool.toLowerCase().includes(search)));\n    }\n    return all;\n  }\n\n  copyToClipboard(text, key) {\n    navigator.clipboard.writeText(text).then(() => {\n      this.setState(s => ({ copyStates: { ...s.copyStates, [key]: true } }));\n      setTimeout(() => {\n        this.setState(s => {\n          const next = { ...s.copyStates };\n          delete next[key];\n          return { copyStates: next };\n        });\n      }, 1800);\n    });\n  }\n\n  renderVals() {\n    const allPrompts = this.getAllPrompts();\n    const allCategories = ['All', ...this.data.map(s => s.category)];\n\n    const pillIcons = {\n      'All': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.9 5.8H20l-4.9 3.6 1.9 5.8L12 14.6 6.1 18.2l1.9-5.8L3 8.8h6.1z\"/><\u002Fsvg>',\n      'Getting Started': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 10v6M2 10l10-5 10 5-10 5z\"/><path d=\"M6 12v5c3 3 9 3 12 0v-5\"/><\u002Fsvg>',\n      'Data & Analysis': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M21 12c0 1.66-4 3-9 3s-9-1.34-9-3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><\u002Fsvg>',\n      'Writing & Comms': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><\u002Fsvg>',\n      'Strategy & Planning': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><\u002Fsvg>',\n      'Learning & Exploration': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M12 2a7 7 0 0 1 4 12.7V17H8v-2.3A7 7 0 0 1 12 2z\"/><\u002Fsvg>',\n      'Go Deeper': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><polygon points=\"16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76\"/><\u002Fsvg>',\n      'Coding': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"16 18 22 12 16 6\"/><polyline points=\"8 6 2 12 8 18\"/><\u002Fsvg>',\n      'Tools & Workflows': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/><\u002Fsvg>',\n      'Design & Imagery': '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/><path d=\"M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662\"/><\u002Fsvg>'\n    };\n\n    const categoryPills = allCategories.map((name, i) => {\n      const idx = i - 1;\n      const isActive = this.state.activeCategory === idx;\n      return {\n        label: name,\n        iconHtml: React.createElement('span', { dangerouslySetInnerHTML: { __html: pillIcons[name] || '' }, style: { display: 'inline-flex', alignItems: 'center', opacity: isActive ? 1 : 0.5 } }),\n        bg: isActive ? '#00D639' : 'transparent',\n        color: isActive ? '#000' : '#fff',\n        borderColor: isActive ? '#00D639' : 'rgba(255,255,255,0.4)',\n        onClick: (e) => {\n          e.stopPropagation();\n          this.setState({ activeCategory: idx });\n        }\n      };\n    });\n\n    const onSurpriseMe = () => {\n      const pool = this.data.flatMap(s => s.prompts.map(p => ({ ...p, category: s.category })));\n      const random = pool[Math.floor(Math.random() * pool.length)];\n      this.setState({ modalPrompt: random, modalCopyState: '' });\n    };\n\n    // Fixed card style\n    const cardBg = '#0B0B0B';\n    const cardBorder = 'rgba(255,255,255,0.46)';\n    const cardShadow = 'inset 0 1px 0 rgba(255,255,255,0.045), 0 18px 50px rgba(0,0,0,0.34)';\n    const cardHoverBg = 'radial-gradient(circle at 50% 0%, rgba(255,255,255,0.085), transparent 64%), linear-gradient(180deg, rgba(255,255,255,0.060), rgba(255,255,255,0.018)), #0D0D0D';\n    const cardHoverBorder = 'rgba(255,255,255,0.66)';\n    const cardHoverShadow = 'inset 0 1px 0 rgba(255,255,255,0.09), 0 24px 70px rgba(0,0,0,0.56)';\n\n    // Tweak: show categories\n    const showCats = this.props.showCategories ?? true;\n\n    // Tweak: columns\n    const cols = this.props.columns ?? '3';\n\n    // Tweak: container width\n    const containerMaxWidth = this.props.containerWidth ?? 1080;\n\n    // Tweak: pills container width\n    const pillsContainerWidth = this.props.pillsContainerWidth ?? 950;\n\n    const cards = allPrompts.map((p, i) => {\n      const key = 'card-' + i;\n      return {\n        category: showCats ? p.category : '',\n        showCategory: showCats,\n        title: p.title,\n        promptHtml: React.createElement('span', { dangerouslySetInnerHTML: { __html: this.highlightVars(p.prompt) } }),\n        copyLabel: this.state.copyStates[key] ? '✓ Copied' : 'Copy',\n        cardBg: cardBg,\n        cardBorder: cardBorder,\n        cardShadow: cardShadow || '0 0 0 rgba(0,0,0,0)',\n        cardHoverBg: cardHoverBg,\n        cardHoverBorder: cardHoverBorder,\n        cardHoverShadow: cardHoverShadow || '0 0 0 1px rgba(255,255,255,0.06), 0 22px 80px rgba(0,0,0,0.55)',\n        onCopy: (e) => { e.stopPropagation(); this.copyToClipboard(p.prompt, key); },\n        onPersonalise: (e) => {\n          e.stopPropagation();\n          const vars = this.extractVars(p.prompt);\n          const varValues = {};\n          vars.forEach(v => varValues[v] = '');\n          this.setState({ persPrompt: p, varValues, modalPrompt: null });\n        },\n        onExpand: () => {\n          this.setState({ modalPrompt: p, modalCopyState: '' });\n        }\n      };\n    });\n\n    const showNoResults = allPrompts.length === 0;\n\n    // Modal data\n    const mp = this.state.modalPrompt;\n    const modalData = mp ? {\n      category: this.data.find(s => s.prompts.includes(mp))?.category || '',\n      tool: mp.tool,\n      title: mp.title,\n      source: mp.source,\n      promptHtml: React.createElement('span', { dangerouslySetInnerHTML: { __html: this.highlightVars(mp.prompt) } }),\n      copyLabel: this.state.modalCopyState === 'copied' ? '✓ Copied' : 'Copy',\n      onCopy: (e) => {\n        e.stopPropagation();\n        navigator.clipboard.writeText(mp.prompt).then(() => {\n          this.setState({ modalCopyState: 'copied' });\n          setTimeout(() => this.setState({ modalCopyState: '' }), 1800);\n        });\n      },\n      onPersonalise: (e) => {\n        e.stopPropagation();\n        const vars = this.extractVars(mp.prompt);\n        const varValues = {};\n        vars.forEach(v => varValues[v] = '');\n        this.setState({ persPrompt: mp, varValues, modalPrompt: null });\n      }\n    } : { category: '', tool: '', title: '', source: '', promptHtml: '', copyLabel: 'Copy', onCopy: () => {}, onPersonalise: () => {} };\n\n    // Personaliser data\n    const pp = this.state.persPrompt;\n    const persData = pp ? (() => {\n      const vars = this.extractVars(pp.prompt);\n      const vv = this.state.varValues;\n      const previewHtml = React.createElement('span', {\n        dangerouslySetInnerHTML: {\n          __html: this.escHtml(pp.prompt).replace(/\\[([^\\]]*)\\]/g, (match, key) => {\n            const val = vv[key];\n            if (val && val.trim()) return '<span style=\"color:#00D639;font-weight:700\">' + this.escHtml(val.trim()) + '<\u002Fspan>';\n            return '<span style=\"color:#00D639;font-weight:600\">[' + this.escHtml(key) + ']<\u002Fspan>';\n          })\n        }\n      });\n      const finalText = pp.prompt.replace(/\\[([^\\]]*)\\]/g, (match, key) => {\n        const val = vv[key];\n        return (val && val.trim()) ? val.trim() : match;\n      });\n      return {\n        title: pp.title,\n        vars: vars.map(v => ({\n          label: '[' + v + ']',\n          placeholder: v,\n          onInput: (e) => {\n            const val = e.target.value;\n            this.setState(s => ({ varValues: { ...s.varValues, [v]: val } }));\n          }\n        })),\n        previewHtml,\n        copyLabel: this.state.persCopyState === 'copied' ? '✓ Copied!' : 'Copy prompt',\n        onCopy: () => {\n          navigator.clipboard.writeText(finalText).then(() => {\n            this.setState({ persCopyState: 'copied' });\n            setTimeout(() => this.setState({ persCopyState: '' }), 1800);\n          });\n        }\n      };\n    })() : { title: '', vars: [], previewHtml: '', copyLabel: 'Copy prompt', onCopy: () => {} };\n\n    return {\n      categoryPills,\n      cards,\n      promptCount: allPrompts.length,\n      showNoResults,\n      showModal: !!this.state.modalPrompt,\n      modalData,\n      showPersonaliser: !!this.state.persPrompt,\n      persData,\n      onSearch: (e) => this.setState({ search: e.target.value }),\n      onSurpriseMe,\n      gridCols: cols === '2' ? 'repeat(2, minmax(0, 1fr))' : cols === '4' ? 'repeat(4, minmax(0, 1fr))' : 'repeat(3, minmax(0, 1fr))',\n      containerMaxWidth,\n      pillsContainerWidth,\n      closeModal: () => this.setState({ modalPrompt: null }),\n      closePersonaliser: () => this.setState({ persPrompt: null }),\n      stopProp: (e) => e.stopPropagation()\n    };\n  }\n\n  componentDidMount() {\n    // Library Surprise Me button animation sequence\n    const btn = document.getElementById('libSurpriseBtn');\n    if (btn && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      const sequence = [\n        { className: 'is-shimmering', duration: 1200 },\n        { className: 'is-pulsing',    duration: 1050 },\n        { className: 'is-bouncing',   duration: 1000 },\n        { className: 'is-wiggling',   duration: 1000 }\n      ];\n      const allClasses = sequence.map(s => s.className);\n      let idx = 0;\n      const run = () => {\n        allClasses.forEach(c => btn.classList.remove(c));\n        void btn.offsetWidth;\n        btn.classList.add(sequence[idx].className);\n        window.setTimeout(() => {\n          btn.classList.remove(sequence[idx].className);\n          idx = (idx + 1) % sequence.length;\n          window.setTimeout(run, idx === 0 ? 5000 : 850);\n        }, sequence[idx].duration);\n      };\n      window.setTimeout(run, 5000);\n    }\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape') {\n        if (this.state.persPrompt) this.setState({ persPrompt: null });\n        else if (this.state.modalPrompt) this.setState({ modalPrompt: null });\n      }\n    });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
